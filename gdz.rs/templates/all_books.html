<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Grid</title>
    <style>
        .image-grid {
            display: flex;
            flex-wrap: wrap;
        }
        .image-grid .image-item {
            width: 120px;
            margin: 5px;
            background-color: #f0f0f0;
            text-align: center; /* Center the text under the image */
        }
        .image-grid .image-item img {
            max-width: 100%;
            height: auto;
        }
        .image-grid .image-item p {
            margin-top: 5px;
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="image-grid">
        {% for path, info_item in image_info %}
        <div class="image-item">
            <img src="/{{ path }}" alt="Image">
            <p>{{ info_item }}</p>
            <div class="button" onclick="window.location.href='{{ url_for('show_razred', ime=ime, razred=razred) }}/{{info_item}}'">Разред {{ razred }}</div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
