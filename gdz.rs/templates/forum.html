<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Форум</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        .forum-container {
            width: 80%;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            padding: 20px;
        }
        .buttons {
            text-align: center;
            margin-bottom: 20px;
        }
        .buttons button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        .forum-list {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
        }
        .forum-item {
            padding: 15px;
            border-bottom: 1px solid #ccc;
        }
        .forum-item:last-child {
            border-bottom: none;
        }
        .forum-item h3 {
            margin: 0;
        }
        .forum-item p {
            margin: 5px 0 0;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="forum-container">
        <div class="header">
            <h1>Добро пожаловать на Форум</h1>
        </div>
        <div class="buttons">
            <button onclick="window.location.href='/create_forum'">Создать форум</button>
            <button onclick="window.location.href='/create_question'">Создать вопрос</button>
            <button onclick="window.location.href='/forum/{{ page+1 }}'">перейти на страницу {{page+1}} </button>
        </div>
        <div class="forum-list">
    {% for forum in forums %}
        <div class="forum-item">
            <h3>тема {{ forum[0] }}</h3> <!-- Допустим, это title -->
            <p> под наслов {{ forum[1] }}</p>
            <p>аутор {{ forum[4] }}</p>
            <p>популарност {{ forum[5] }}</p>
            <button onclick="window.location.href='/forum/{{ forum[0] }}'">погледати</button>


        </div>
    {% else %}
        <p>Нет доступных форумов или вопросов.</p>
    {% endfor %}
</div>
    </div>
</body>
</html>
