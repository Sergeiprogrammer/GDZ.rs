<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f0f0f0;
        }
        .main-button {
            display: inline-block;
            padding: 15px 30px;
            font-size: 18px;
            color: white;
            background-color: #5865F2;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }
        .main-button:hover {
            background-color: #4752C4;
        }
        .description {
            margin-top: 20px;
            font-size: 16px;
            color: #333;
        }
    </style>
</head>
<body>

    <a href="https://discord.gg/bhbJMXz8XD" class="main-button">Присоединяйтесь к нашему Discord</a>

    <div class="description">
        Добро пожаловать на наш сайт! Нажмите на кнопку выше, чтобы присоединиться к нашему Discord-серверу и стать частью сообщества.
    </div>

</body>
</html>
