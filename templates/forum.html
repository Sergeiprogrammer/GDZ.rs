<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Форум</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        .forum-container {
            width: 80%;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            padding: 20px;
        }
        .buttons {
            text-align: center;
            margin-bottom: 20px;
        }
        .buttons button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        .forum-list {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
        }
        .forum-item {
            padding: 15px;
            border-bottom: 1px solid #ccc;
        }
        .forum-item:last-child {
            border-bottom: none;
        }
        .forum-item h3 {
            margin: 0;
        }
        .forum-item p {
            margin: 5px 0 0;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="forum-container">
        <div class="header">
            <h1>Добро пожаловать на Форум</h1>
        </div>
        <div class="buttons">
            <button onclick="window.location.href='/create_forum'">Создать форум</button>
            <button onclick="window.location.href='/create_question'">Создать вопрос</button>
        </div>
        <div class="forum-list">
            <!-- Здесь будет динамический список форумов или вопросов -->
            <div class="forum-item">
                <h3>Название форума или вопроса</h3>
                <p>Описание или краткое содержание</p>
            </div>
            <!-- Повторить для других элементов -->
        </div>
    </div>
</body>
</html>
