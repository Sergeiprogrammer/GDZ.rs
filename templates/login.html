<!-- Форма для отправки кода подтверждения -->
<form id="send-code-form">
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" required>
    <button type="button" onclick="sendVerificationCode()">Отправить код</button>
    <p id="message" style="color: green;"></p>
</form>

<!-- Форма регистрации -->
<form id="register-form" action="/register" method="post">
    <input type="hidden" id="email-hidden" name="email">  <!-- Скрытое поле для email -->

    <label for="username">Имя пользователя</label>
    <input type="text" id="username" name="username" required>

    <label for="password">Пароль</label>
    <input type="password" id="password" name="password" required>

    <label for="verification_code">Код подтверждения</label>
    <input type="text" id="verification_code" name="verification_code" required>

    <button type="submit">Зарегистрироваться</button>
</form>

<script>
    function sendVerificationCode() {
        let email = document.getElementById("email").value;
        let message = document.getElementById("message");

        if (!email) {
            message.style.color = "red";
            message.textContent = "Введите email!";
            return;
        }

        fetch("/send_verification_code", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: email })
        })
        .then(response => response.json())
        .then(data => {
            message.style.color = data.status === "success" ? "green" : "red";
            message.textContent = data.message;

            // Заполняем скрытое поле для формы регистрации
            document.getElementById("email-hidden").value = email;
        })
        .catch(error => {
            console.error("Ошибка при отправке кода:", error);
            message.style.color = "red";
            message.textContent = "Ошибка при отправке кода!";
        });
    }
</script>
