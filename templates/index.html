<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ГДЗ - готови домаћи задаци</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .subject-button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 20px;
            margin: 10px;
            cursor: pointer;
            border-radius: 10px;
            width: 300px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s, box-shadow 0.3s;
        }
        .subject-button:hover {
            background-color: #45a049;
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <h1>School Schedule</h1>
    <div class="button-container">
        <button class="subject-button" onclick="window.location.href='/predmet/fizika'">Физика</button>
        <button class="subject-button" onclick="window.location.href='/predmet/matematika'">Математика</button>
        <button class="subject-button" onclick="window.location.href='/predmet/geografija'">Географија</button>
        <button class="subject-button" onclick="window.location.href='/predmet/istorija'">Историја</button>
        <button class="subject-button" onclick="window.location.href='/predmet/srpski-jezik'">Српски језик</button>
        <button class="subject-button" onclick="window.location.href='/predmet/hemija'">Хемија</button>
        <button class="subject-button" onclick="window.location.href='/predmet/biologija'">Биологија</button>
        <button class="subject-button" onclick="window.location.href='/predmet/muzicko'">Музичко</button>
        <button class="subject-button" onclick="window.location.href='/predmet/likovno'">Ликовно</button>
        <button class="subject-button" onclick="window.location.href='/predmet/informatika'">Информатика</button>
        <button class="subject-button" onclick="window.location.href='/predmet/engleski-jezik'">Енглески језик</button>
        <button class="subject-button" onclick="window.location.href='/predmet/fizicko'">Физичко</button>
        <button class="subject-button" onclick="window.location.href='/predmet/gradjansko-veronauka'">Грађанско/Веронаука</button>
        <button class="subject-button" onclick="window.location.href='/predmet/chos'">ЧОС</button>
        <button class="subject-button" onclick="window.location.href='/forum'">Форум (место у ком можите да причате са људима)</button>
    </div>

</body></html>
